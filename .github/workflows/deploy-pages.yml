# Builds the Angular app and publishes it as a live demo on GitHub Pages:
#   https://<your-user>.github.io/<repository-name>/
# One-time setup on GitHub: Settings → Pages → "Build and deployment" → Source: GitHub Actions.
# GitHub Pages only serves static files, so the neural voice server (tools/tts-server.mjs) cannot run there:
# tools/tts-prerender.mjs records every narration line with the same Saudi neural voice (Hamed) into voice/*.mp3.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build for /<repository-name>/
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Restore recorded narration clips
        uses: actions/cache@v4
        with:
          path: .tts-cache
          key: tts-${{ hashFiles('public/data/**', 'src/app/core/arabic.ts', 'src/app/imagine/narration-lines.ts', 'src/app/pavilion/pavilion-plan.ts', 'tools/tts-*.mjs') }}
          restore-keys: tts-

      - name: Pre-record the Arabic narration (neural voice)
        run: node tools/tts-prerender.mjs dist/expo-twin-angular/browser
        # without the recordings the demo still works, with the browser's voices
        continue-on-error: true
        timeout-minutes: 30

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/expo-twin-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
